<!DOCTYPE html>
<html>
<head>
  <title>Student Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div id="student-form" class="max-w-md mx-auto mt-12"></div>
<script type="module">
import "https://cdn.jsdelivr.net/gh/keshavsoft/json-to-tag@main/docs/dist/v4/min.js";
const formSpec = {
  tagName: "form",
  classList: "bg-white p-6 rounded-2xl shadow-lg",
  children: [
    {
      tagName: "h2",
      textContent: "Student Registration",
      classList: "text-2xl font-bold text-center text-gray-800 mb-6"
    },
    {
      tagName: "label",
      textContent: "Student Name",
      classList: "block text-sm font-semibold text-gray-700 mb-2"
    },
    {
      tagName: "input",
      classList: "w-full px-4 py-3 rounded-lg border border-gray-300 mb-4 outline-none focus:ring-2 focus:ring-blue-500",
      attributes: {
        type: "text",
        name: "student",
        placeholder: "Enter your name"
      }
    },
    {
      tagName: "label",
      textContent: "Mobile Number",
      classList: "block text-sm font-semibold text-gray-700 mb-2"
    },
    {
      tagName: "input",
      classList: "w-full px-4 py-3 rounded-lg border border-gray-300 mb-5 outline-none focus:ring-2 focus:ring-blue-500",
      attributes: {
        type: "tel",
        name: "phone",
        placeholder: "Enter mobile number"
      }
    },
    {
      tagName: "button",
      textContent: "Register",
      classList: "w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition",
      attributes: {
        type: "submit"
      }
    }
  ]
};
const form = window.ks.jsonToTag.buildSpecElement(formSpec);
form.onsubmit = (event) => {
  event.preventDefault();
  console.log("Name:", form.elements.student.value);
  console.log("Mobile:", form.elements.phone.value);
};
document.querySelector("#student-form").append(form);
</script>
</body>
</html>
